name: Compatibility
permissions:
  contents: read
concurrency:
  group: issue52-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    name: compatibility (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: build-tools
          commands: npm run test:build-tools
          native: false
          timeout: 25
        - suite: void
          node: 24.21.0
          commands: 'npm install --prefix void

            npm run build --prefix void

            npm run test:void

            node --test tests/void/routes/acceptance.test.mjs

            '
          native: false
          timeout: 25
        - suite: upstream-minvoice
          commands: 'npm install --prefix authentication

            npm run typecheck --prefix authentication

            node tests/upstream/minvoice/prepare.mjs

            node --test tests/upstream/minvoice/browser.test.mjs tests/authentication/backend.test.mjs tests/authentication/live/worker.test.mjs

            '
          native: false
          timeout: 25
        - suite: upstream-pknotes
          node: 24.21.0
          commands: 'node tests/upstream/pknotes/prepare.mjs

            node --test tests/upstream/pknotes/browser.test.mjs

            '
          native: false
          timeout: 25
        - suite: upstream-opennext
          commands: 'npm run test:upstream:opennext:prepare

            npm run test:upstream:opennext

            '
          native: false
          timeout: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Isolate comparison download cache
      run: printf '%s\n' 'issue52-full-20261020-v1' 'before-compatibility-${{ matrix.suite }}' > .ci-measurement-cache-scope
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ matrix.node || '22' }}
        cache: npm
        cache-dependency-path: 'package.json

          demo/package.json


          .ci-measurement-cache-scope'
    - run: npm install
    - run: npm run build
    - run: npm install
      working-directory: demo
    - run: npm run typecheck
      working-directory: demo
    - run: npx playwright install --with-deps chromium webkit
      working-directory: demo
    - name: Run ${{ matrix.suite }} contracts
      run: ${{ matrix.commands }}
      working-directory: demo
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      if: matrix.native || matrix.suite == 'opennext'
      with:
        distribution: temurin
        java-version: '21'
    - run: npm install --prefix demo/opennext
      if: matrix.native
    - name: Enable emulator acceleration
      if: matrix.native || matrix.suite == 'opennext'
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Test the public API in Android WebView
      if: matrix.native
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: UPSTREAM_PLATFORM=android UPSTREAM_DEVICE=emulator-5554 node --test demo/tests/upstream/${{ matrix.native }}/native.test.mjs
    - name: Test OpenNext routes and release skew in Android WebView
      if: matrix.suite == 'opennext'
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        disable-animations: true
        script: 'OPENNEXT_SPLIT=1 OPENNEXT_PLATFORM=android OPENNEXT_DEVICE=emulator-5554 node --test demo/tests/opennext/native.test.mjs

          OPENNEXT_PLATFORM=android OPENNEXT_DEVICE=emulator-5554 node demo/tests/opennext/releases/native.mjs

          '
    - name: Save native acceptance evidence
      if: always() && (matrix.native || matrix.suite == 'opennext')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-${{ matrix.native || matrix.suite }}
        path: 'demo/artifacts/upstream/${{ matrix.native }}/native/android-*.json

          demo/artifacts/upstream/${{ matrix.native }}/native/android-error.log

          demo/artifacts/opennext-native/android-*.json

          demo/artifacts/opennext-native/android-error.log

          demo/artifacts/opennext-releases/native/android-*.json

          demo/artifacts/opennext-releases/native/android-error.log

          '
        retention-days: 7
  required:
    name: Measured suites
    if: ${{ always() }}
    needs:
    - compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
    - name: Require every measured suite to succeed
      env:
        COMPATIBILITY: ${{ needs.compatibility.result }}
      run: test "$COMPATIBILITY" = success
'on':
  workflow_dispatch:
    inputs:
      phase:
        description: Cold first, then warm on this identical ref
        type: choice
        options:
        - cold
        - warm
        required: true
run-name: Issue 52 before affected suites (${{ inputs.phase }})
