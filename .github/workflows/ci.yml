name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/url-idna/bundle-url.mjs --check
      - run: npm run build
      - run: npm test -- --allowOnly=false

  compatibility:
    name: compatibility (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workers
            commands: |
              npm run test:node-inventory
              npm run test:workers -- --allowOnly=false
              npm run test:browser
          - suite: runtime
            commands: |
              npm run test:runtime
              npm run test:runtime:dev
              npm run test:documents
              npm run build:native-documents -- --mode express
          - suite: build-tools
            commands: npm run test:build-tools
          - suite: void
            node: 24.21.0
            commands: |
              npm ci --prefix void
              npm run build --prefix void
              npm run test:void
          - suite: opennext
            commands: |
              npm ci --prefix opennext
              npm run build:worker --prefix opennext
              npm run test:opennext
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node || '22' }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
      - run: npx playwright install --with-deps chromium webkit
        working-directory: demo
      - name: Run ${{ matrix.suite }} contracts
        run: ${{ matrix.commands }}
        working-directory: demo

  bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hyperdrive-test-only
          MYSQL_DATABASE: hyperdrive_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -phyperdrive-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
      - run: npx playwright install --with-deps chromium webkit
        working-directory: demo
      - run: npm run test:d1-migration
        working-directory: demo
      - run: npm run test:service-bindings
        working-directory: demo
      - run: npm run test:cloudflare-bindings
        working-directory: demo
      - run: npm run test:hyperdrive-migration
        working-directory: demo
        env:
          HYPERDRIVE_TEST_MYSQL_URL: mysql://root:hyperdrive-test-only@127.0.0.1:3306/hyperdrive_test

  streams-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
      - run: npx playwright install --with-deps chromium webkit
        working-directory: demo
      - run: npm run test:runtime:fallback
        working-directory: demo
      - run: npm run test:runtime:fallback:dev
        working-directory: demo

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:package
      - name: Verify packed native plugin discovery
        run: node demo/tests/scripts/prepare-native-package.mjs

  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: demo
      - name: Fetch the pinned official Hono sample
        run: npm run test:upstream:prepare -- hono-jsx-ssr --clone-only
        working-directory: demo
      - name: Check the original Worker in workerd
        run: npm run test:upstream:workerd -- --reporter=default --reporter=json --outputFile=artifacts/upstream/workerd-results.json
        working-directory: demo
      - run: npx playwright install --with-deps chromium webkit
        working-directory: demo
      - name: Build and test the browser adapter against the same expectations
        run: npm run test:upstream:browser
        working-directory: demo
      - name: Save upstream test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-hono-jsx-ssr
          path: |
            demo/tests/upstream/hono-jsx-ssr/upstream.json
            demo/artifacts/upstream/*-results.json
            demo/artifacts/upstream/playwright/
          retention-days: 7

  required:
    name: CI
    if: ${{ always() }}
    needs: [library, compatibility, bindings, streams-fallback, package, upstream]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          LIBRARY: ${{ needs.library.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          BINDINGS: ${{ needs.bindings.result }}
          STREAMS: ${{ needs['streams-fallback'].result }}
          PACKAGE: ${{ needs.package.result }}
          UPSTREAM: ${{ needs.upstream.result }}
        run: |
          test "$LIBRARY" = success
          test "$COMPATIBILITY" = success
          test "$BINDINGS" = success
          test "$STREAMS" = success
          test "$PACKAGE" = success
          test "$UPSTREAM" = success
