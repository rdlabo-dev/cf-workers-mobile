name: Release

on:
  push:
    tags: ["v*"]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Compatibility]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/beta')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for the tagged main commit's Compatibility run
        if: github.event_name == 'push'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { waitForReleaseCI } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-wait.mjs`);
            await waitForReleaseCI(github, context, { log: core.info });
      - name: Resolve release and require successful main CI
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { resolveRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/npm-release.mjs`);
            return await resolveRelease(github, context);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.result != 'null'
        with:
          repository: ${{ fromJSON(steps.plan.outputs.result).repository || github.repository }}
          ref: ${{ fromJSON(steps.plan.outputs.result).sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.result != 'null'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the exact release candidate
        if: steps.plan.outputs.result != 'null'
        env:
          VERSION: ${{ fromJSON(steps.plan.outputs.result).version }}
          DIST_TAG: ${{ fromJSON(steps.plan.outputs.result).channel }}
        run: |
          npm install
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm pkg set "publishConfig.tag=$DIST_TAG"
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --pack-destination "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.result != 'null'
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    # Only authorized candidates enter the publication queue.
    concurrency:
      group: npm-release
      cancel-in-progress: false
    needs: prepare
    if: needs.prepare.outputs.plan != 'null'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - name: Revalidate authorization and candidate
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PLAN: ${{ needs.prepare.outputs.plan }}
        with:
          script: |
            const plan = JSON.parse(process.env.PLAN);
            const { isReleaseCurrent } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/npm-release.mjs`);
            return await isReleaseCurrent(github, context, plan);
      - name: Publish the built tarball
        if: steps.current.outputs.result == 'true'
        env:
          PLAN: ${{ needs.prepare.outputs.plan }}
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/npm-release/*.tgz)
          test "${#archives[@]}" -eq 1
          tar -xOf "${archives[0]}" package/package.json > "$RUNNER_TEMP/release-package.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const plan = JSON.parse(process.env.PLAN);
          const pkg = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-package.json`, 'utf8'));
          assert.equal(pkg.name, 'cf-workers-native');
          assert.equal(pkg.version, plan.version);
          assert.equal(pkg.publishConfig.tag, plan.channel);
          assert.equal(pkg.publishConfig.access, 'public');
          assert.ok(!pkg.publishConfig.registry || pkg.publishConfig.registry === 'https://registry.npmjs.org');
          JS
          DIST_TAG=$(node -p 'JSON.parse(process.env.PLAN).channel')
          npm publish "${archives[0]}" --ignore-scripts --provenance --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org
